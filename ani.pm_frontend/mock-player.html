<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AML mock player</title>
<style>
html,body{margin:0;height:100%;background:#030304;color:#fff;font-family:Inter,system-ui,sans-serif}
body{display:grid;place-items:center;overflow:hidden}
.stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#52213a 0,transparent 32%),linear-gradient(135deg,#08090d,#16101a)}
.card{position:relative;z-index:1;text-align:center;max-width:520px;padding:30px}
.play{width:74px;height:74px;border-radius:50%;border:1px solid #ffffff35;background:#ffffff12;color:#fff;font-size:28px;cursor:pointer;backdrop-filter:blur(16px)}
h1{font-size:22px;margin:18px 0 8px}p{color:#999;font-size:13px}.meta{font-size:11px;color:#777;margin-top:18px}
.bar{position:fixed;left:5%;right:5%;bottom:24px;height:4px;border-radius:999px;background:#ffffff22}.bar:before{content:"";display:block;width:34%;height:100%;border-radius:inherit;background:#ff3b5c}
</style>
</head>
<body>
<div class="stage"></div><div class="card"><button class="play" id="play">▶</button><h1>AML mock player</h1><p>No external stream is loaded. This frame exists to exercise the original extracted watch/player UI.</p><div class="meta" id="meta"></div></div><div class="bar"></div>
<script>
const q=new URLSearchParams(location.search);meta.textContent='Episode '+(q.get('ep')||'1')+' · '+(q.get('channel')||'sub')+' · local fixture';
let playing=false;
function send(type,extra={}){parent.postMessage({source:'settlar-embed',version:1,type,...extra},'*')}
send('mounted');send('state',{currentTime:8,duration:1440,paused:true,muted:true});
play.onclick=()=>{playing=!playing;play.textContent=playing?'❚❚':'▶';send(playing?'play':'pause');send('state',{currentTime:playing?120:120,duration:1440,paused:!playing,muted:true})};
addEventListener('message',e=>{const m=e.data||{};if(m.type==='play'){playing=true;play.textContent='❚❚'}if(m.type==='pause'){playing=false;play.textContent='▶'}if(m.type==='sound')send('state',{currentTime:120,duration:1440,paused:!playing,muted:!m.on})});
</script>
</body></html>
