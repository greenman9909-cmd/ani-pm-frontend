<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Yoru — mock anime product</title>
<style>
:root{--bg:#050506;--panel:#0e0e11;--panel2:#141418;--line:#24242b;--text:#f7f7f9;--muted:#9a9aa3;--dim:#676772;--accent:#ff3b5c;--accent2:#ff8a3d;--radius:18px;--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;scroll-behavior:smooth}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}button{color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,#25131a66,transparent 35%),linear-gradient(#050506,#050506);z-index:-1}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:50;height:68px;padding:0 24px;display:flex;align-items:center;gap:20px;background:#050506e8;backdrop-filter:blur(18px);border-bottom:1px solid #18181d}.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em}.logoMark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;box-shadow:0 0 28px #ff3b5c33}.mockTag{font-size:10px;padding:4px 7px;border:1px solid #383840;border-radius:999px;color:#aaa}.nav{display:flex;gap:6px}.nav a{padding:9px 12px;border-radius:10px;color:#aaa;font-size:14px}.nav a.active,.nav a:hover{background:#15151a;color:white}.topSearch{margin-left:auto;width:min(330px,30vw);position:relative}.topSearch input{width:100%;height:40px;border-radius:12px;border:1px solid #292930;background:#101014;color:white;padding:0 40px 0 14px;outline:none}.iconBtn,.avatarBtn{width:40px;height:40px;border:1px solid #292930;background:#101014;border-radius:12px;display:grid;place-items:center;cursor:pointer}.avatarBtn{border-radius:50%;background:linear-gradient(135deg,#3d2646,#933a58);font-weight:700}.mobileNav{display:none}
main{max-width:1320px;margin:auto;padding:26px 24px 90px}.pageTitle{font-size:clamp(34px,5vw,64px);letter-spacing:-.055em;margin:18px 0 8px}.sub{color:var(--muted);max-width:760px}.section{margin-top:44px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}.sectionHead h2{font-size:24px;margin:0;letter-spacing:-.035em}.sectionHead p{margin:0;color:var(--dim);font-size:13px}
.hero{min-height:510px;border:1px solid #24242b;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(110deg,#1b0d14 0%,#140f1c 35%,#111827 100%);display:flex;align-items:end;padding:46px}.hero:before,.poster:before,.coverArt:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 65% 40%,#ff3b5c44,transparent 28%),radial-gradient(circle at 80% 70%,#6e48ff44,transparent 24%),linear-gradient(120deg,transparent 20%,#ffffff0a 20%,#ffffff0a 22%,transparent 22%);transform:rotate(-5deg)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08080bea 0 36%,transparent 75%),linear-gradient(0deg,#08080bcc,transparent 55%)}.heroContent{position:relative;z-index:2;max-width:580px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#c5aab4}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.92;letter-spacing:-.06em;margin:12px 0 18px}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#b5b5bd;font-size:13px}.pill{padding:5px 9px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff13;font-size:11px}.actions{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}.btn{border:1px solid #313139;background:#16161b;border-radius:12px;padding:10px 15px;cursor:pointer}.btn.primary{background:white;color:#08080a;border-color:white;font-weight:750}.btn.accent{background:var(--accent);border-color:var(--accent);color:white}.btn.ghost:hover{background:#202027}
.row{display:flex;gap:14px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.card{flex:0 0 180px;cursor:pointer}.poster{height:258px;border-radius:16px;background:#17171d;border:1px solid #292931;overflow:hidden;position:relative}.poster.g1{background:linear-gradient(145deg,#2d0c21,#5b1732 50%,#161025)}.poster.g2{background:linear-gradient(145deg,#0b2632,#19506a 48%,#160f28)}.poster.g3{background:linear-gradient(145deg,#271a0b,#71521a 52%,#20100c)}.poster.g4{background:linear-gradient(145deg,#122614,#2c6a3e 52%,#101a25)}.poster.g5{background:linear-gradient(145deg,#1a1437,#4f3e88 52%,#23101d)}.posterLabel{position:absolute;inset:auto 12px 12px;z-index:2;font-size:38px;font-weight:900;letter-spacing:-.06em;color:#ffffffd9}.badge{position:absolute;top:10px;left:10px;z-index:2;background:#050506cc;border:1px solid #ffffff1a;border-radius:999px;padding:5px 8px;font-size:10px}.card h3{font-size:14px;margin:9px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:12px;color:var(--dim);margin:0 2px}.progress{height:3px;border-radius:999px;background:#25252c;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:22px 14px}.grid .card{min-width:0;flex:none}.grid .poster{height:auto;aspect-ratio:2/3}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid #2d2d35;background:#101014;color:#aaa;border-radius:999px;padding:8px 12px;font-size:12px;cursor:pointer}.chip.on{background:white;color:#0a0a0d;border-color:white}.searchHero{padding:70px 0 34px;max-width:900px;margin:auto;text-align:center}.searchHero input{width:100%;height:64px;border-radius:20px;background:#101014;border:1px solid #303039;padding:0 22px;color:white;font-size:20px;outline:none}.empty{border:1px dashed #303038;border-radius:18px;padding:50px;text-align:center;color:#7f7f89}
.detailHero{display:grid;grid-template-columns:220px 1fr;gap:34px;align-items:end;min-height:440px;padding:44px;border:1px solid #24242b;border-radius:26px;background:linear-gradient(120deg,#140d14,#11131d);position:relative;overflow:hidden}.coverArt{aspect-ratio:2/3;border-radius:18px;background:linear-gradient(145deg,#29101f,#6a1c3a 55%,#101321);position:relative;overflow:hidden;border:1px solid #ffffff1a}.detailInfo{position:relative;z-index:2}.detailInfo h1{font-size:clamp(42px,6vw,76px);line-height:.95;letter-spacing:-.06em;margin:8px 0 18px}.tabs{display:flex;gap:8px;border-bottom:1px solid #25252d;margin-top:30px;overflow:auto}.tab{padding:12px 14px;border:0;background:transparent;color:#898993;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:white;border-color:white}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:18px}.episode{border:1px solid #292931;background:#101014;border-radius:15px;padding:14px;display:grid;grid-template-columns:88px 1fr;gap:12px;cursor:pointer}.thumb{border-radius:10px;background:linear-gradient(135deg,#222536,#511c36);aspect-ratio:16/9}.episode h4{margin:3px 0 5px}.episode p{margin:0;color:#777;font-size:12px}
.panel{border:1px solid #292931;background:#0e0e12;border-radius:18px;padding:20px}.split{display:grid;grid-template-columns:230px 1fr;gap:22px}.sideNav{display:flex;flex-direction:column;gap:4px}.sideNav button{border:0;background:transparent;color:#93939d;padding:11px 12px;text-align:left;border-radius:10px;cursor:pointer}.sideNav button.on{background:#1b1b21;color:white}.settingsGrid{display:grid;gap:12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #202027;padding:16px 0}.setting:last-child{border:0}.setting small{display:block;color:#777;margin-top:4px}.toggle{width:46px;height:27px;border-radius:999px;background:#2c2c33;border:0;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.toggle.on{background:var(--accent)}.toggle.on:after{left:22px}
.profileHero{display:flex;gap:24px;align-items:center;padding:26px 0}.bigAvatar{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff3b5c,#5b31a8);font-size:34px;font-weight:800}.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}.stat strong{display:block;font-size:22px}.stat span{color:#777;font-size:11px}.xp{height:8px;border-radius:999px;background:#22222a;overflow:hidden;margin-top:10px}.xp i{display:block;width:68%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.award{border:1px solid #282830;background:#101014;border-radius:14px;padding:16px}.award i{font-style:normal;font-size:24px}.award h4{margin:10px 0 4px}.award p{font-size:11px;color:#777;margin:0}
.communityLayout{display:grid;grid-template-columns:1fr 320px;gap:18px}.thread{padding:16px;border-bottom:1px solid #24242b;display:flex;gap:13px}.thread:last-child{border:0}.miniAvatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#33213c;font-size:12px;flex:none}.thread h4{margin:0 0 4px}.thread p{margin:0;color:#777;font-size:12px}.leader{display:grid;grid-template-columns:50px 1fr auto;align-items:center;padding:14px 8px;border-bottom:1px solid #23232a}.rank{font-size:18px;color:#777}.schedule{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:1px solid #27272f;border-radius:16px;background:#0e0e12;padding:12px;min-height:180px}.day h4{margin:0 0 12px}.premiere{padding:9px;border-radius:10px;background:#17171d;margin-bottom:8px;font-size:11px}.premiere small{color:#777}
.playerLayout{display:grid;grid-template-columns:1fr 340px;gap:16px}.player{aspect-ratio:16/9;border:1px solid #292931;border-radius:20px;background:#020203;position:relative;display:grid;place-items:center;overflow:hidden}.player:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#47182b55,transparent 32%)}.play{width:72px;height:72px;border-radius:50%;border:1px solid #ffffff33;background:#ffffff14;backdrop-filter:blur(8px);font-size:28px;cursor:pointer;z-index:2}.playerBar{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}.playerBar input{width:100%}.playlist{max-height:560px;overflow:auto}.playlist .episode{grid-template-columns:70px 1fr;margin-bottom:8px}.legal{max-width:820px;margin:auto}.legal h1{font-size:58px;letter-spacing:-.05em}.legal h2{margin-top:42px}.legal p{color:#a0a0a8}
.modalBack{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:100;padding:20px}.modal{width:min(430px,100%);background:#111116;border:1px solid #303038;border-radius:22px;padding:22px}.modal h2{margin:0 0 8px}.modal input{width:100%;height:46px;margin-top:10px;border-radius:11px;border:1px solid #2d2d35;background:#09090c;color:white;padding:0 12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-size:12px;z-index:150}
@media(max-width:900px){.nav{display:none}.topSearch{width:auto;flex:1}.communityLayout,.playerLayout,.split{grid-template-columns:1fr}.sideNav{flex-direction:row;overflow:auto}.schedule{grid-template-columns:repeat(2,1fr)}.detailHero{grid-template-columns:160px 1fr}.mobileNav{display:flex;position:fixed;z-index:60;bottom:0;left:0;right:0;height:64px;background:#08080bed;border-top:1px solid #24242b;backdrop-filter:blur(18px);justify-content:space-around;align-items:center}.mobileNav a{font-size:11px;color:#999}.mobileNav a.active{color:white}}
@media(max-width:620px){main{padding:18px 14px 90px}.topbar{padding:0 14px}.topSearch{display:none}.mockTag{display:none}.hero{min-height:520px;padding:28px;border-radius:20px}.detailHero{grid-template-columns:1fr;align-items:start;padding:22px}.coverArt{width:150px}.profileHero{align-items:flex-start}.bigAvatar{width:84px;height:84px}.schedule{grid-template-columns:1fr}.pageTitle{font-size:42px}.legal h1{font-size:42px}.card{flex-basis:145px}.poster{height:215px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const BRAND="Yoru";
const MOCK=true;
const titles=[
{id:"neon-archive",title:"Neon Archive",year:2026,format:"TV",score:8.7,genres:["Sci-Fi","Mystery"],episodes:12,progress:62,initials:"NA",g:"g1",status:"Airing"},
{id:"glass-horizon",title:"Glass Horizon",year:2026,format:"TV",score:8.4,genres:["Drama","Fantasy"],episodes:10,progress:34,initials:"GH",g:"g2",status:"Airing"},
{id:"moonframe",title:"Moonframe",year:2025,format:"Movie",score:8.9,genres:["Romance","Sci-Fi"],episodes:1,progress:0,initials:"MF",g:"g5",status:"Finished"},
{id:"wild-signal",title:"Wild Signal",year:2026,format:"TV",score:8.1,genres:["Action","Comedy"],episodes:24,progress:78,initials:"WS",g:"g3",status:"Airing"},
{id:"quiet-engine",title:"Quiet Engine",year:2024,format:"TV",score:7.9,genres:["Slice of Life","Drama"],episodes:12,progress:100,initials:"QE",g:"g4",status:"Finished"},
{id:"after-image",title:"After Image",year:2026,format:"ONA",score:8.3,genres:["Thriller","Mystery"],episodes:8,progress:0,initials:"AI",g:"g1",status:"Upcoming"},
{id:"starfall-radio",title:"Starfall Radio",year:2025,format:"TV",score:8.0,genres:["Music","Drama"],episodes:13,progress:45,initials:"SR",g:"g2",status:"Finished"},
{id:"redline-garden",title:"Redline Garden",year:2026,format:"TV",score:8.6,genres:["Action","Fantasy"],episodes:12,progress:12,initials:"RG",g:"g3",status:"Airing"},
{id:"paper-sky",title:"Paper Sky",year:2025,format:"TV",score:7.8,genres:["Comedy","School"],episodes:12,progress:0,initials:"PS",g:"g4",status:"Finished"},
{id:"signal-zero",title:"Signal Zero",year:2026,format:"Movie",score:8.2,genres:["Action","Sci-Fi"],episodes:1,progress:0,initials:"SZ",g:"g5",status:"Upcoming"},
{id:"blue-static",title:"Blue Static",year:2024,format:"TV",score:7.7,genres:["Sports","Drama"],episodes:25,progress:93,initials:"BS",g:"g2",status:"Finished"},
{id:"mirror-district",title:"Mirror District",year:2026,format:"TV",score:8.5,genres:["Mystery","Supernatural"],episodes:12,progress:0,initials:"MD",g:"g1",status:"Airing"}
];
const people=[
{name:"Mira",handle:"@mira",xp:8420,rank:1,color:"#6e48ff"},
{name:"Kian",handle:"@kian",xp:7910,rank:2,color:"#ff3b5c"},
{name:"Nova",handle:"@nova",xp:7350,rank:3,color:"#2a8fb8"},
{name:"Sora",handle:"@sora",xp:6890,rank:4,color:"#c47a31"},
{name:"Rin",handle:"@rin",xp:6310,rank:5,color:"#3f9a62"}
];
const state={tab:"episodes",libraryTab:"my",communityTab:"forum",settings:"account",search:"",playing:false};
function route(){return location.hash.slice(1)||"/"}
function nav(path,label){return '<a href="#'+path+'" data-nav="'+path+'">'+label+'</a>'}
function shell(content){return '<header class="topbar"><a class="logo" href="#/"><span class="logoMark">Y</span><span>'+BRAND+'</span><span class="mockTag">MOCK DATA</span></a><nav class="nav">'+nav("/","Home")+nav("/anime","Browse")+nav("/community","Community")+nav("/library","Library")+'</nav><div class="topSearch"><input id="topSearch" placeholder="Search anime…" value="'+escapeHtml(state.search)+'"></div><button class="iconBtn" data-action="notifications">●</button><button class="avatarBtn" data-action="auth">YR</button></header><main>'+content+'</main><nav class="mobileNav">'+nav("/","Home")+nav("/anime","Browse")+nav("/search","Search")+nav("/library","Library")+nav("/profile","Profile")+'</nav>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(t,cont=false){return '<article class="card" data-title="'+t.id+'"><div class="poster '+t.g+'"><span class="badge">'+(t.status==="Airing"?"EP "+Math.min(t.episodes,Math.max(1,Math.ceil(t.progress/8))):t.status)+'</span><span class="posterLabel">'+t.initials+'</span></div><h3>'+t.title+'</h3><p>'+t.format+' · '+t.year+' · ★ '+t.score+'</p>'+(cont?'<div class="progress"><i style="width:'+t.progress+'%"></i></div>':'')+'</article>'}
function cards(arr,cont=false){return arr.map(t=>card(t,cont)).join("")}
function home(){const h=titles[0];return shell('<section class="hero"><div class="heroContent"><div class="eyebrow">Spring 2026 · Mock premiere</div><h1>'+h.title+'</h1><div class="meta"><span>'+h.format+'</span><span>•</span><span>'+h.year+'</span><span class="pill">Sub</span><span class="pill">Dub</span><span>★ '+h.score+'</span></div><p class="sub">A synthetic series used to exercise the full Yoru interface. No external anime metadata or video service is connected.</p><div class="actions"><button class="btn primary" data-watch="'+h.id+'">▶ Watch mock episode</button><button class="btn ghost" data-title-open="'+h.id+'">Details</button><button class="btn ghost" data-action="libraryAdd">＋ My list</button></div></div></section>'+
section("Continue watching","Device-local mock progress",'<div class="row">'+cards(titles.filter(x=>x.progress>0&&x.progress<100),true)+'</div>')+
section("Trending now","Synthetic ranking",'<div class="row">'+cards(titles.slice(0,8))+'</div>')+
section("Latest episodes","No network requests",'<div class="grid">'+cards(titles.slice(2,10))+'</div>')+
'<section class="section"><div class="communityLayout"><div class="panel"><div class="sectionHead"><h2>Community</h2><p>Mock discussions</p></div>'+thread("Mira","What are you watching this week?","12 replies · 4m ago")+thread("Kian","Best opening sequence in the mock catalog","8 replies · 19m ago")+thread("Nova","Season schedule testing thread","5 replies · 1h ago")+'</div><div class="panel"><div class="sectionHead"><h2>Site activity</h2><p>local fixture</p></div><div class="stats"><div class="stat"><strong>128</strong><span>online</span></div><div class="stat"><strong>42</strong><span>watching</span></div><div class="stat"><strong>19</strong><span>chatting</span></div></div></div></div></section>')}
function section(title,subtxt,body){return '<section class="section"><div class="sectionHead"><div><h2>'+title+'</h2></div><p>'+subtxt+'</p></div>'+body+'</section>'}
function browse(){return shell('<h1 class="pageTitle">Browse anime</h1><p class="sub">The same browsing surface, driven entirely by synthetic fixtures.</p><div class="filters">'+["Trending","Genres","Tags","Studio","Year","Season","Format","Upcoming"].map((x,i)=>'<button class="chip '+(i===0?"on":"")+'" data-filter="'+x+'">'+x+'</button>').join("")+'</div><div class="panel" style="margin-bottom:18px"><input id="browseQuery" placeholder="Search mock catalog…" style="width:100%;height:45px;border:0;background:transparent;color:white;outline:none"></div><div class="grid" id="browseGrid">'+cards(titles)+'</div>')}
function searchPage(){const q=decodeURIComponent(route().split("?q=")[1]||state.search||"");const arr=q?titles.filter(x=>(x.title+" "+x.genres.join(" ")).toLowerCase().includes(q.toLowerCase())):titles.slice(0,6);return shell('<section class="searchHero"><div class="eyebrow">Search</div><h1 class="pageTitle">Find something to watch</h1><input id="bigSearch" autofocus placeholder="Search anime…" value="'+escapeHtml(q)+'"><div class="filters" style="justify-content:center"><button class="chip" data-search-term="Neon">Neon</button><button class="chip" data-search-term="Mystery">Mystery</button><button class="chip" data-search-term="2026">2026</button></div></section>'+section(q?'Results for “'+escapeHtml(q)+'”':'Recent & suggested',arr.length+' mock results','<div class="grid">'+cards(arr)+'</div>'))}
function details(id){const t=titles.find(x=>x.id===id)||titles[0];const eps=Array.from({length:Math.min(t.episodes,12)},(_,i)=>'<article class="episode" data-watch="'+t.id+'" data-ep="'+(i+1)+'"><div class="thumb"></div><div><small>Episode '+(i+1)+'</small><h4>'+["First Signal","Night Train","Glass Room","Parallel Line","Red Shift","After Hours"][i%6]+'</h4><p>24 min · mock source</p></div></article>').join("");return shell('<section class="detailHero"><div class="coverArt '+t.g+'"><span class="posterLabel">'+t.initials+'</span></div><div class="detailInfo"><div class="eyebrow">'+t.status+' · '+t.year+'</div><h1>'+t.title+'</h1><div class="meta"><span>'+t.format+'</span><span>•</span><span>'+t.episodes+' episodes</span><span>•</span><span>★ '+t.score+'</span>'+t.genres.map(g=>'<span class="pill">'+g+'</span>').join("")+'</div><p class="sub">A fictional title created only for interface testing. Metadata, availability, comments and episode information are synthetic.</p><div class="actions"><button class="btn primary" data-watch="'+t.id+'">▶ Watch now</button><button class="btn ghost" data-action="libraryAdd">＋ Library</button><button class="btn ghost" data-action="share">Share</button></div></div></section><div class="tabs">'+["episodes","cast","details","related","comments","downloads"].map(x=>'<button class="tab '+(state.tab===x?"on":"")+'" data-detail-tab="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join("")+'</div><div id="detailBody">'+detailTab(t,eps)+'</div>')}
function detailTab(t,eps){if(state.tab==="episodes")return '<div class="episodes">'+eps+'</div>';if(state.tab==="cast")return '<div class="badges section">'+["Ari Vale","Jun Mori","Elia North","Mako Reed"].map((n,i)=>'<div class="award"><i>◉</i><h4>'+n+'</h4><p>Mock voice role '+(i+1)+'</p></div>').join("")+'</div>';if(state.tab==="details")return '<div class="panel section"><h2>Details</h2><p class="sub">Format: '+t.format+' · Episodes: '+t.episodes+' · Status: '+t.status+' · Year: '+t.year+'</p><p class="sub">English: '+t.title+' · Romaji: '+t.title.replaceAll(" ","-")+' · Native: synthetic</p></div>';if(state.tab==="comments")return '<div class="panel section">'+thread("Mira","The color design on this mock page is great.","2m ago")+thread("Nova","Testing nested comment states here.","8m ago")+'</div>';if(state.tab==="downloads")return '<div class="empty section">Downloads are disabled in this mock build.</div>';return '<div class="grid section">'+cards(titles.filter(x=>x.id!==t.id).slice(0,6))+'</div>'}
function watch(id,ep=1){const t=titles.find(x=>x.id===id)||titles[0];const list=Array.from({length:Math.min(t.episodes,12)},(_,i)=>'<article class="episode" data-watch="'+t.id+'" data-ep="'+(i+1)+'"><div class="thumb"></div><div><small>Episode '+(i+1)+'</small><h4>'+t.title+'</h4><p>'+(i+1===Number(ep)?"Now selected":"Mock episode")+'</p></div></article>').join("");return shell('<div class="playerLayout"><div><div class="player"><button class="play" id="playBtn">'+(state.playing?"❚❚":"▶")+'</button><div class="playerBar"><input type="range" min="0" max="100" value="32"><div class="meta"><span>'+t.title+' · Episode '+ep+'</span><span style="margin-left:auto">Mock player · no stream loaded</span></div></div></div><div class="actions"><button class="btn" data-title-open="'+t.id+'">About</button><button class="btn" data-action="autoplay">Autoplay</button><button class="btn" data-action="captions">Captions</button><button class="btn" data-action="theater">Theater</button></div></div><aside class="panel playlist"><div class="sectionHead"><h2>Episodes</h2><p>'+t.episodes+' total</p></div>'+list+'</aside></div>')}
function library(){const tabs=["my","history","liked","folders"];const labels={my:"My list",history:"History",liked:"Liked",folders:"Folders"};let body=state.libraryTab==="folders"?'<div class="grid"><div class="panel"><h3>Late Night</h3><p class="sub">4 titles</p></div><div class="panel"><h3>Weekend</h3><p class="sub">7 titles</p></div><div class="panel"><h3>Rewatch</h3><p class="sub">3 titles</p></div></div>':'<div class="grid">'+cards(state.libraryTab==="history"?titles.filter(x=>x.progress>0):state.libraryTab==="liked"?titles.slice(1,7):titles.slice(0,9),state.libraryTab==="history")+'</div>';return shell('<h1 class="pageTitle">Library</h1><p class="sub">Local mock lists, history, likes and folders.</p><div class="tabs">'+tabs.map(x=>'<button class="tab '+(state.libraryTab===x?"on":"")+'" data-lib-tab="'+x+'">'+labels[x]+'</button>').join("")+'</div><div class="section">'+body+'</div>')}
function profile(username="you"){const p=username==="you"?{name:"Yoru Tester",handle:"@yoru_test",xp:4820,rank:12}:{name:username[0].toUpperCase()+username.slice(1),handle:"@"+username,xp:3650,rank:24};return shell('<section class="profileHero"><div class="bigAvatar">'+p.name.split(" ").map(x=>x[0]).join("").slice(0,2)+'</div><div><div class="eyebrow">Public mock profile</div><h1 style="font-size:42px;margin:5px 0">'+p.name+'</h1><div class="sub">'+p.handle+' · joined Sep 2026</div><div class="stats"><div class="stat"><strong>182</strong><span>followers</span></div><div class="stat"><strong>96</strong><span>following</span></div><div class="stat"><strong>37</strong><span>in library</span></div><div class="stat"><strong>124</strong><span>episodes tracked</span></div></div><div class="xp"><i></i></div><small class="sub">Level 18 · '+p.xp+' XP</small></div></section>'+section("Badges","Synthetic achievement state",'<div class="badges">'+["First Steps","Getting Hooked","Marathoner","Collector","Finisher","Voice Heard","Rising Star","Veteran"].map((x,i)=>'<div class="award"><i>'+["◈","◇","✦","⬡"][i%4]+'</i><h4>'+x+'</h4><p>'+["Common","Rare","Epic","Legendary"][i%4]+' · mock badge</p></div>').join("")+'</div>')+section("Recent activity","Fixture history",'<div class="row">'+cards(titles.slice(0,6),true)+'</div>'))}
function settings(){const sections=["account","appearance","content","player","captions","notifications","data"];const labels={account:"Account",appearance:"Appearance",content:"Content & playback",player:"Player",captions:"Captions",notifications:"Notifications",data:"Your data"};return shell('<h1 class="pageTitle">Settings</h1><p class="sub">Changes are local to this browser and exist only to exercise settings UI.</p><div class="split section"><aside class="panel sideNav">'+sections.map(x=>'<button class="'+(state.settings===x?"on":"")+'" data-settings="'+x+'">'+labels[x]+'</button>').join("")+'</aside><section class="panel"><div class="sectionHead"><h2>'+labels[state.settings]+'</h2><p>Saved on this device</p></div><div class="settingsGrid">'+settingsBody()+'</div></section></div>')}
function settingsBody(){const map={account:[["Display name","Yoru Tester"],["Profile visibility","Public"],["Avatar color","Rose"]],appearance:[["Glass surfaces","On"],["Compact cards","Off"],["Accent","Rose"]],content:[["Preferred audio","Sub"],["Mature titles","Hidden"],["Auto-add progress","On"]],player:[["Autoplay next","On"],["Auto-skip intro","Off"],["Default quality","Auto"]],captions:[["Font","Inter"],["Size","100%"],["Background","65%"]],notifications:[["New episodes","On"],["Replies","On"],["Product updates","Off"]],data:[["Mock sync","Device only"],["Export","Available"],["Delete mock data","Available"]]};return map[state.settings].map((x,i)=>'<div class="setting"><div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div>'+(i%2===0?'<button class="toggle '+(x[1]==="On"?"on":"")+'" data-toggle></button>':'<button class="btn">Change</button>')+'</div>').join("")}
function thread(user,title,meta){return '<div class="thread"><div class="miniAvatar">'+user.slice(0,2).toUpperCase()+'</div><div><h4>'+title+'</h4><p>'+user+' · '+meta+'</p></div></div>'}
function community(){return shell('<h1 class="pageTitle">Community</h1><p class="sub">Chat/forum surfaces with local mock participants.</p><div class="tabs"><button class="tab '+(state.communityTab==="chat"?"on":"")+'" data-community="chat">Chat</button><button class="tab '+(state.communityTab==="forum"?"on":"")+'" data-community="forum">Forum</button></div><div class="communityLayout section"><div class="panel" id="communityBody">'+(state.communityTab==="chat"?chatBody():forumBody())+'</div><aside class="panel"><div class="sectionHead"><h2>Online</h2><p>128</p></div>'+people.map(p=>'<div class="thread" data-user="'+p.name.toLowerCase()+'"><div class="miniAvatar" style="background:'+p.color+'55">'+p.name.slice(0,2)+'</div><div><h4>'+p.name+'</h4><p>'+p.handle+' · level '+(20-p.rank)+'</p></div></div>').join("")+'</aside></div>')}
function chatBody(){return '<div style="min-height:390px">'+thread("Mira","Neon Archive episode 4 was wild","2m ago")+thread("Kian","Testing the mobile chat composer","6m ago")+thread("Nova","Schedule card is working here","12m ago")+'</div><div class="setting"><input id="chatInput" placeholder="Write a mock message…" style="flex:1;background:#0a0a0d;border:1px solid #292930;border-radius:12px;color:white;height:42px;padding:0 12px"><button class="btn accent" data-action="sendChat">Send</button></div>'}
function forumBody(){return '<div><button class="btn primary" data-action="newThread">＋ New thread</button></div>'+thread("Mira","What are you watching this week?","12 replies · 4m ago")+thread("Kian","Share your subtitle setup","21 replies · 14m ago")+thread("Nova","Season schedule discussion","8 replies · 1h ago")+thread("Sora","Feature request: compact library cards","31 replies · 3h ago")}
function leaderboard(){return shell('<h1 class="pageTitle">Leaderboard</h1><p class="sub">Ranked by synthetic XP from mock community activity.</p><div class="panel section">'+people.concat([{name:"Yoru Tester",handle:"@yoru_test",xp:4820,rank:12,color:"#ff3b5c"}]).map((p,i)=>'<div class="leader"><span class="rank">#'+(i+1)+'</span><div class="thread" style="border:0;padding:0"><div class="miniAvatar" style="background:'+p.color+'55">'+p.name.slice(0,2)+'</div><div><h4>'+p.name+'</h4><p>'+p.handle+'</p></div></div><strong>'+p.xp.toLocaleString()+' XP</strong></div>').join("")+'</div>')}
function schedule(){const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];return shell('<h1 class="pageTitle">Release schedule</h1><p class="sub">Synthetic premiere times for layout and countdown testing.</p><div class="schedule section">'+days.map((d,i)=>'<div class="day"><h4>'+d+'</h4>'+titles.slice(i%4,i%4+3).map((t,j)=>'<div class="premiere"><strong>'+t.title+'</strong><br><small>'+(18+j)+':'+(j?"30":"00")+' · in '+(i+j+1)+'h</small></div>').join("")+'</div>').join("")+'</div>')}
function watchTogether(){return shell('<h1 class="pageTitle">Watch together</h1><p class="sub">Room creation, participant and chat states are mocked. No video session is created.</p><div class="communityLayout section"><div class="panel"><h2>Create a room</h2><p class="sub">Choose a mock title and generate a local room code.</p><select style="width:100%;height:45px;background:#0a0a0d;color:white;border:1px solid #292930;border-radius:12px;padding:0 10px">'+titles.slice(0,6).map(t=>'<option>'+t.title+'</option>').join("")+'</select><button class="btn primary" data-action="room" style="margin-top:12px">Create room</button></div><div class="panel"><h2>Join</h2><input id="roomCode" placeholder="Room code" style="width:100%;height:45px;background:#0a0a0d;color:white;border:1px solid #292930;border-radius:12px;padding:0 10px"><button class="btn" data-action="joinRoom" style="margin-top:12px">Join mock room</button></div></div>')}
function listing(titleText,desc){return shell('<h1 class="pageTitle">'+titleText+'</h1><p class="sub">'+desc+'</p><div class="grid section">'+cards(titles)+'</div>')}
function legal(type){const copy={about:["About "+BRAND,"Yoru is a mock anime catalogue interface built for UI testing. It contains synthetic titles, profiles, activity and playback states. It does not connect to ani.pm or any streaming provider."],privacy:["Privacy","This test build stores only small interface preferences in your browser. It has no account backend, analytics pipeline or real user records."],terms:["Terms","This build is a non-production UI prototype. All catalogue entries and community identities are fictional test fixtures. No playback rights or media availability are implied."]};const c=copy[type];return shell('<article class="legal"><div class="eyebrow">Mock documentation</div><h1>'+c[0]+'</h1><p>'+c[1]+'</p><h2>What this prototype covers</h2><p>Home discovery, catalogue filters, search, title details, library states, profiles, settings, community surfaces, schedule, leaderboard, watch-room layout and player controls.</p><h2>What it intentionally does not do</h2><p>No real authentication, no real profile data, no third-party streaming, no copied anime artwork, no production API calls and no background tracking.</p></article>')}
function notFound(){return shell('<div class="empty" style="margin-top:80px"><h1>404</h1><p>This route is not part of the mock surface.</p><a class="btn primary" href="#/">Go home</a></div>')}
function render(){const p=route().split("?")[0];let out;if(p==="/")out=home();else if(p==="/anime")out=browse();else if(p==="/search")out=searchPage();else if(p.startsWith("/title/")||p.startsWith("/anime/"))out=details(p.split("/").pop());else if(p.startsWith("/watch/")){const a=p.split("/");out=watch(a[2],a[3]||1)}else if(p==="/library")out=library();else if(p==="/profile")out=profile();else if(p.startsWith("/user/"))out=profile(p.split("/").pop());else if(p==="/settings")out=settings();else if(p==="/community")out=community();else if(p==="/leaderboard")out=leaderboard();else if(p==="/schedule")out=schedule();else if(p==="/watch-together")out=watchTogether();else if(p==="/genres")out=listing("Genres","Browse the mock catalogue by genre.");else if(p==="/latest")out=listing("Latest","Recently added synthetic episodes.");else if(p==="/recent")out=listing("Recent","Recently viewed mock titles.");else if(p==="/collections")out=listing("Collections","Curated fixture groups for testing.");else if(p==="/downloads")out=listing("Downloads","Download UI only. No media files are provided.");else if(["/about","/privacy","/terms"].includes(p))out=legal(p.slice(1));else out=notFound();document.getElementById("app").innerHTML=out;bind();setActive(p);window.scrollTo(0,0)}
function setActive(p){document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===p||(a.dataset.nav==="/anime"&&p.startsWith("/anime/"))))}
function go(p){location.hash=p}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function modal(){const d=document.createElement("div");d.className="modalBack";d.innerHTML='<div class="modal"><div class="eyebrow">Mock authentication</div><h2>Sign in to '+BRAND+'</h2><p class="sub">No account is created. This modal only tests the auth surface.</p><input placeholder="Email"><input placeholder="Password" type="password"><div class="actions"><button class="btn primary" id="fakeLogin">Continue as tester</button><button class="btn" id="closeModal">Cancel</button></div></div>';document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="closeModal")d.remove();if(e.target.id==="fakeLogin"){d.remove();toast("Signed in as mock tester")}}}
function bind(){
 document.querySelectorAll("[data-title],[data-title-open]").forEach(el=>el.onclick=()=>go("/title/"+(el.dataset.title||el.dataset.titleOpen)));
 document.querySelectorAll("[data-watch]").forEach(el=>el.onclick=()=>go("/watch/"+el.dataset.watch+"/"+(el.dataset.ep||1)));
 const top=document.getElementById("topSearch");if(top)top.onkeydown=e=>{if(e.key==="Enter"){state.search=top.value;go("/search?q="+encodeURIComponent(top.value))}};
 const big=document.getElementById("bigSearch");if(big)big.onkeydown=e=>{if(e.key==="Enter"){state.search=big.value;go("/search?q="+encodeURIComponent(big.value));render()}};
 document.querySelectorAll("[data-search-term]").forEach(x=>x.onclick=()=>{state.search=x.dataset.searchTerm;go("/search?q="+encodeURIComponent(state.search));render()});
 const bq=document.getElementById("browseQuery");if(bq)bq.oninput=()=>{document.getElementById("browseGrid").innerHTML=cards(titles.filter(t=>(t.title+" "+t.genres.join(" ")).toLowerCase().includes(bq.value.toLowerCase())))};
 document.querySelectorAll("[data-filter]").forEach(x=>x.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(y=>y.classList.remove("on"));x.classList.add("on");toast(x.dataset.filter+" filter selected")});
 document.querySelectorAll("[data-detail-tab]").forEach(x=>x.onclick=()=>{state.tab=x.dataset.detailTab;render()});
 document.querySelectorAll("[data-lib-tab]").forEach(x=>x.onclick=()=>{state.libraryTab=x.dataset.libTab;render()});
 document.querySelectorAll("[data-settings]").forEach(x=>x.onclick=()=>{state.settings=x.dataset.settings;render()});
 document.querySelectorAll("[data-community]").forEach(x=>x.onclick=()=>{state.communityTab=x.dataset.community;render()});
 document.querySelectorAll("[data-toggle]").forEach(x=>x.onclick=()=>x.classList.toggle("on"));
 document.querySelectorAll("[data-user]").forEach(x=>x.onclick=()=>go("/user/"+x.dataset.user));
 const pb=document.getElementById("playBtn");if(pb)pb.onclick=()=>{state.playing=!state.playing;pb.textContent=state.playing?"❚❚":"▶";toast(state.playing?"Mock playback started":"Mock playback paused")};
 document.querySelectorAll("[data-action]").forEach(x=>x.onclick=()=>{const a=x.dataset.action;if(a==="auth")modal();else if(a==="share"){navigator.clipboard?.writeText(location.href);toast("Mock link copied")}else if(a==="room")toast("Room YR-4821 created");else if(a==="joinRoom")toast("Joined mock room");else if(a==="sendChat")toast("Mock message posted");else if(a==="newThread")toast("Thread composer opened");else if(a==="notifications")toast("No new mock notifications");else toast("Mock action: "+a)});
}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
